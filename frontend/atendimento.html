<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="css/style.css"></head>
<body>
<a class="login-back-button" href="index.html">← Voltar ao login</a>
<div class="container">
<h2>Atendimento</h2>

<input type="text" id="nome" placeholder="Nome">
<input type="text" id="cpf" placeholder="CPF" inputmode="numeric" minlength="11" maxlength="11" pattern="[0-9]{11}" required aria-describedby="cpfErro">
<p id="cpfErro" role="alert" hidden></p>
<input id="dataNascimento" placeholder="Data Nascimento">
<input id="sexo" placeholder="Sexo">
<input id="nomeMãe" placeholder="Nome Mãe">
<input id="estadoCivil" placeholder="Estado Civil">
<input id="endereco" placeholder="Endereço">
<input type="number" id="telefone" placeholder="Telefone">
<input type="email" id="email" placeholder="Email">
<input type="number" id="contatoEMG" placeholder="Contato de Emergência">


<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<input type="file" id="foto">

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
async function cadastrar(){
 const cpf = document.getElementById("cpf").value.trim();
 const cpfErro = document.getElementById("cpfErro");

 if (!/^[0-9]{11}$/.test(cpf)) {
  cpfErro.textContent = "CPF deve conter exatamente 11 números.";
  cpfErro.hidden = false;
  return;
 }

 cpfErro.hidden = true;

 let resposta;
 try {
  resposta = await fetch("http://localhost:3000/atendimento",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body: JSON.stringify({
     nome: document.getElementById("nome").value,
     cpf,
     tipo: document.getElementById("tipo").value
   })
  });
 } catch {
  cpfErro.textContent = "Não foi possível enviar o cadastro. Tente novamente.";
  cpfErro.hidden = false;
  return;
 }

 const dados = await resposta.json();
 if (!resposta.ok) {
  cpfErro.textContent = dados.erro || "Não foi possível cadastrar o paciente.";
  cpfErro.hidden = false;
  return;
 }

 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
