<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="container login-container">
  <img src="" alt="">
  <h2>Hospital Empatia sempre</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <p id="loginErro" role="alert" hidden></p>
</div>

<script>
async function login() {
  const mensagem = document.getElementById("loginErro");
  mensagem.hidden = true;
  mensagem.textContent = "";

  try {
    const resposta = await fetch("/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        usuario: document.getElementById("usuario").value,
        senha: document.getElementById("senha").value
      })
    });
    const dados = await resposta.json();
    if (!resposta.ok) throw new Error(dados.erro || "Não foi possível fazer login");

    const destinos = {
      triagem: "triagem.html",
      medico: "medico.html",
      atendimento: "atendimento.html"
    };
    if (!destinos[dados.tipo]) throw new Error("Setor de usuário inválido");
    location.href = destinos[dados.tipo];
  } catch (erro) {
    mensagem.textContent = erro.message;
    mensagem.hidden = false;
  }
}

// Atalho secreto: Ctrl + Alt + A redirecona para admin.html
window.addEventListener("keydown", function(e) {
  if (e.ctrlKey && e.altKey && (e.key === "a" || e.key === "A")) {
    e.preventDefault();
    window.location.href = "admin.html";
  }
});
</script>
</body>
</html>
